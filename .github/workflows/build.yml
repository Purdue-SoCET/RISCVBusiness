name: Build

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH for private SoCET dependencies
        env:
          SOCET_DEPLOY_KEY: ${{ secrets.SOCET_DEPLOY_KEY }}
        run: |
          if [ -n "$SOCET_DEPLOY_KEY" ]; then
            mkdir -p ~/.ssh
            echo "$SOCET_DEPLOY_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            ssh-keyscan github.com >> ~/.ssh/known_hosts
          fi

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull CI image
        run: docker pull ghcr.io/falcontron/socet-template-ci:latest

      - name: Build and test
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/work" \
            -v "$HOME/.ssh:/home/ubuntu/.ssh:ro" \
            -w /work \
            ghcr.io/falcontron/socet-template-ci:latest \
            bash -lc 'git config --global --add safe.directory /work && export PYTHONPATH="" && ./setup.sh && ./build.sh && ./test.sh'

      - name: Upload build/test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-test-logs
          path: |
            logs/