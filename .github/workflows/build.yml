name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/falcontron/socet-template-ci:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH for private SoCET dependencies
        env:
          SOCET_DEPLOY_KEY: ${{ secrets.SOCET_DEPLOY_KEY }}
        if: ${{ env.SOCET_DEPLOY_KEY != '' }}
        run: |
          mkdir -p ~/.ssh
          echo "$SOCET_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Mark repository as safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup dependencies
        run: ./setup.sh

      - name: Build
        run: ./build.sh

      - name: Test
        run: ./test.sh

      - name: Upload build/test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-test-logs
          path: |
            logs/