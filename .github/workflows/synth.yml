name: Synthesis

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  synth:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH for private SoCET dependencies
        env:
          SOCET_DEPLOY_KEY: ${{ secrets.SOCET_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          if [ -n "$SOCET_DEPLOY_KEY" ]; then
            echo "$SOCET_DEPLOY_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          fi

          ssh-keyscan -H github.com >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull CI image
        run: docker pull ghcr.io/falcontron/socet-template-ci:latest

      - name: Synthesis
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -v "$HOME/.ssh:/root/.ssh:ro" \
            -w /work \
            ghcr.io/falcontron/socet-template-ci:latest \
            bash -lc 'git config --global --add safe.directory /work && export PYTHONPATH="" && ./setup.sh && ./synth.sh'

      - name: Upload synthesis logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthesis-logs
          path: |
            logs/
            synth_out/